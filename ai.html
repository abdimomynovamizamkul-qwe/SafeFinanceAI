<!DOCTYPE html>
<html lang="kk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Кеңесші</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">

<div class="logo-circle">

🛡️

</div>

<div>

<h2>SafeFinanceAI</h2>

<small>AI Қауіпсіздік кеңесшісі</small>

</div>

</div>

</header>


<div class="hero">

<div class="hero-text">

<h1>

🤖 AI Кеңесші

</h1>

<p>

Қаржылық қауіпсіздік бойынша кез келген сұрағыңызды жазыңыз.

</p>

<div class="tip-box">

<h3>🚨 Бүгінгі қауіпсіздік кеңесі</h3>

<p id="dailyTip">

Жүктелуде...

</p>

</div>
<div class="chat-box" id="chatBox">

<div class="bot-message">

Сәлем!

Мен SafeFinanceAI кеңесшісім.

Қандай сұрағыңыз бар?

</div>

</div>


<input

type="text"

id="userInput"

placeholder="Сұрағыңызды жазыңыз...">


<button id="sendBtn">

Жіберу

</button>

</div>

</div>

<script src="ai.js"></script>

</body>

</html>
